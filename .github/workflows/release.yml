name: 📢 Test & Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🚨 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - run: mise run lint

  vuln:
    name: 🔒 Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - run: mise run vuln

  test:
    name: ✅ Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - run: mise run test

  release:
    name: 🔖 Semantic release & publish binaries
    needs: [lint, vuln, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4

      - name: 🏷️ Semantic release (tag + changelog)
        id: semrel
        uses: go-semantic-release/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # go-semantic-release creates the tag through the GitHub API, so the
      # checkout above predates it: goreleaser can't resolve a tag it never
      # fetched ("unexpected git tag output for ... : \"\"").
      - name: 📥 Fetch release tag
        if: steps.semrel.outputs.version != ''
        run: git fetch --force --tags origin

      - name: 📦 Publish binaries with goreleaser
        if: steps.semrel.outputs.version != ''
        run: mise exec goreleaser@2 -- goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ steps.semrel.outputs.version }}