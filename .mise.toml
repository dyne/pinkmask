[tools]
go = "latest"
golangci-lint = "latest"
goreleaser = "2"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"

[env]
BIN_DIR = "bin"
BIN_NAME = "pinkmask"

[tasks.default]
depends = ["build"]

[tasks.build]
description = "Compile the pinkmask binary into ./bin"
run = """
mkdir -p "$BIN_DIR"
BUILD_VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
go build -buildvcs=false -ldflags "-s -w -X main.version=$BUILD_VERSION" -o "$BIN_DIR/$BIN_NAME" ./cmd/pinkmask
"""

[tasks.test]
description = "Run the Go test suite"
run = "go test ./..."

[tasks.lint]
description = "Run gofmt check and golangci-lint"
run = """
unformatted="$(gofmt -l .)"
if [ -n "$unformatted" ]; then
  echo "Not gofmt-formatted:"
  echo "$unformatted"
  exit 1
fi
golangci-lint run ./...
"""

[tasks.vuln]
description = "Run govulncheck for known vulnerabilities"
run = "govulncheck ./..."

[tasks.docs]
description = "Build the VitePress docs (latest + versioned release archives) into docs/.vitepress/dist"
run = "npm run docs:build"

[tasks.docs-preview]
description = "Serve the built docs locally"
run = "npm run docs:preview"